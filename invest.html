<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IA Traders Plans</title>

<style>

body{
    background:#0f0f0f;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

h1{
    text-align:center;
    color:gold;
}

.plans{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    background:#1b1b1b;
    border:2px solid gold;
    border-radius:15px;
    width:260px;
    padding:20px;
    text-align:center;
}

.card h2{
    color:gold;
}

.price{
    font-size:25px;
    font-weight:bold;
}

button{
    background:gold;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

</style>

</head>


<body>


<h1>IA Traders Investment Plans</h1>


<div class="plans">


<div class="card">
<h2>Basic Plan</h2>
<p class="price">Rs.1000</p>
<p>Daily Profit: Rs.100</p>
<button>Invest Now</button>
</div>


<div class="card">
<h2>Silver Plan</h2>
<p class="price">Rs.1500</p>
<p>Daily Profit: Rs.170</p>
<button>Invest Now</button>
</div>


<div class="card">
<h2>Gold Plan</h2>
<p class="price">Rs.2000</p>
<p>Daily Profit: Rs.230</p>
<button>Invest Now</button>
</div>


<div class="card">
<h2>Premium Plan</h2>
<p class="price">Rs.3000</p>
<p>Daily Profit: Rs.350</p>
<button>Invest Now</button>
</div>


<div class="card">
<h2>VIP Plan</h2>
<p class="price">Rs.5000</p>
<p>Daily Profit: Rs.570</p>
<button>Invest Now</button>
</div>


</div>


</body>

</html>
