<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IA Traders Dashboard</title>

<style>

body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.logo{
    text-align:center;
    color:gold;
    font-size:28px;
    font-weight:bold;
}

.balance-card{
    background:#1b1b1b;
    border:2px solid gold;
    border-radius:20px;
    padding:30px;
    text-align:center;
    margin-top:25px;
}

.balance{
    font-size:35px;
    color:#2ecc71;
    font-weight:bold;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:gold;
    font-weight:bold;
    cursor:pointer;
}

.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:30px;
}

.menu div{
    background:#1b1b1b;
    padding:15px 5px;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
}

.icon{
    font-size:25px;
}

.share{
    background:#1b1b1b;
    padding:20px;
    border-radius:15px;
    margin-top:25px;
}

.link{
    color:#2ecc71;
    word-break:break-all;
}

</style>

</head>


<body>


<div class="container">


<div class="logo">
IA Traders
</div>



<div class="balance-card">

<h3>Available Balance</h3>

<div class="balance" id="balance">
Rs.0
</div>


<button onclick="location.href='withdraw.html'">
Withdraw
</button>

</div>



<div class="menu">


<div>
<div class="icon">🏠</div>
Home
</div>


<div onclick="location.href='invest.html'">
 <div class="icon">📦</div>
Plans
</div>


<div onclick="location.href='deposit-history.html'">
<div class="icon">💰</div>
Deposit
</div>


<div onclick="location.href='withdraw-history.html'">
<div class="icon">💸</div>
Withdraw
</div>


</div>



<div class="share">

<h3>Share Website</h3>

<p class="link">
https://ia-traders.github.io/ia-traders
</p>


<button id="copyBtn">
Copy Link
</button>


<button id="logoutBtn">
Logout
</button>


</div>



</div>



<script type="module">


import {
 db,
 auth,
 onAuthStateChanged,
 collection,
 getDocs,
 signOut
} from "./firebase.js";


const balance = document.getElementById("balance");


// Load User Withdrawable Balance

onAuthStateChanged(auth, async(user)=>{


if(!user){

window.location.href="login.html";
return;

}



const snapshot = await getDocs(
collection(db,"investmentRequests")
);



let totalBalance = 0;



snapshot.forEach((item)=>{


const data = item.data();


if(data.uid === user.uid && data.status === "Approved"){


totalBalance += Number(data.withdrawableBalance || 0);


}



});



balance.innerHTML = "Rs." + totalBalance;



});




// Copy Website Link

document.getElementById("copyBtn").onclick = ()=>{


navigator.clipboard.writeText(
"https://ia-traders.github.io/ia-traders"
);


alert("Website link copied");

};




// Logout

document.getElementById("logoutBtn").onclick = async()=>{


await signOut(auth);

window.location.href="login.html";


};


</script>
<!-- WhatsApp Channel Floating Button -->

<a href="https://whatsapp.com/channel/0029Vb8hn1pF1YlKtfnuE90W"
target="_blank"
class="whatsapp-btn">

<i class="fab fa-whatsapp"></i>

</a>


<style>

.whatsapp-btn{

position:fixed;

right:25px;

bottom:25px;

width:60px;

height:60px;

background:#25D366;

color:white;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:35px;

text-decoration:none;

box-shadow:0 5px 15px rgba(0,0,0,0.4);

transition:.3s;

z-index:9999;

}


.whatsapp-btn:hover{

transform:scale(1.1);

background:#20b858;

}


</style>

</body>

</html>
