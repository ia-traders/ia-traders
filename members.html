<!-- Manage Member Popup -->

<div id="manageModal"
style="
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
justify-content:center;
align-items:center;
z-index:999;
">

<div
style="
width:450px;
background:#1b1b1b;
border:2px solid gold;
border-radius:15px;
padding:25px;
">

<h2 style="color:gold;margin-bottom:20px;">
Manage Member
</h2>

<p id="memberEmail"></p>

<label>Balance</label>

<input
id="newBalance"
type="number"
style="
width:100%;
padding:12px;
margin:10px 0 20px;
">

<label>Total Earned</label>

<input
id="newEarned"
type="number"
style="
width:100%;
padding:12px;
margin:10px 0 20px;
">

<button id="saveMember">
Save Changes
</button>

<button
id="closeModal"
style="background:red;color:white;">
Close
</button>

</div>

</div>

<script type="module" src="js/members.js"></script>

</body>
</html>
