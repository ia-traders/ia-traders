<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Members | IA Traders Admin</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:white;
display:flex;
min-height:100vh;
}

.sidebar{
width:260px;
background:#181818;
border-right:2px solid gold;
padding:20px;
}

.logo{
font-size:28px;
font-weight:bold;
color:gold;
text-align:center;
margin-bottom:40px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
text-decoration:none;
color:white;
padding:15px;
margin-bottom:10px;
border-radius:10px;
transition:.3s;
}

.menu a:hover{
background:gold;
color:black;
}

.main{
flex:1;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.header h1{
color:gold;
}

.search-box{
margin-bottom:25px;
}

.search-box input{
width:100%;
padding:14px;
border-radius:10px;
border:2px solid gold;
background:#1b1b1b;
color:white;
font-size:16px;
outline:none;
}

.table-box{
background:#1b1b1b;
border:2px solid gold;
border-radius:15px;
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

thead{
background:gold;
color:black;
}

th,td{
padding:15px;
text-align:center;
border-bottom:1px solid #333;
}

button{
padding:10px 16px;
background:gold;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#2ecc71;
}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
IA Traders
</div>

<div class="menu">

<a href="admin-dashboard.html">
<i class="fas fa-house"></i>
Dashboard
</a>

<a href="members.html">
<i class="fas fa-users"></i>
Members
</a>

<a href="#">
<i class="fas fa-money-bill-wave"></i>
Deposits
</a>

<a href="#">
<i class="fas fa-wallet"></i>
Withdraws
</a>

</div>

</div>

<div class="main">

<div class="header">
<h1>Members</h1>
</div>

<div class="search-box">

<input
type="text"
id="searchMember"
placeholder="Search by Name or Email...">

</div>

<div class="table-box">

<table>

<thead>

<tr>

<th>User</th>
<th>Email</th>
<th>Plan</th>
<th>Balance</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="membersTable">

<tr>

<td colspan="6">

Loading Members...

</td>

</tr>
