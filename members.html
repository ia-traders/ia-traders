<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Members | IA Traders Admin</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:white;
display:flex;
min-height:100vh;
}

.sidebar{
width:260px;
background:#181818;
border-right:2px solid gold;
padding:20px;
}

.logo{
font-size:28px;
font-weight:bold;
color:gold;
text-align:center;
margin-bottom:40px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
text-decoration:none;
color:white;
padding:15px;
margin-bottom:10px;
border-radius:10px;
transition:.3s;
}

.menu a:hover{
background:gold;
color:black;
}

.main{
flex:1;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.header h1{
color:gold;
}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
IA Traders
</div>

<div class="menu">

<a href="admin-dashboard.html">
<i class="fas fa-house"></i>
Dashboard
</a>

<a href="members.html">
<i class="fas fa-users"></i>
Members
</a>

</div>

</div>

<div class="main">

<div class="header">

<h1>Members</h1>

</div><!-- Search Box -->

<div style="margin-bottom:25px;">

<input
type="text"
id="searchMember"
placeholder="Search by Name or Email..."
style="
width:100%;
padding:14px;
border-radius:10px;
border:2px solid gold;
background:#1b1b1b;
color:white;
font-size:16px;
outline:none;
">

</div>

<!-- Members Table -->

<div
style="
background:#1b1b1b;
border:2px solid gold;
border-radius:15px;
overflow:hidden;
">

<table
style="
width:100%;
border-collapse:collapse;
">

<thead>

<tr
style="
background:gold;
color:black;
">

<th style="padding:15px;">User</th>
<th>Email</th>
<th>Plan</th>
<th>Balance</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="membersTable">

<tr>

<td colspan="6"
style="
padding:30px;
text-align:center;
">

Loading Members...

</td>

</tr>

</tbody>

</table>

</div></div>

  <!-- Manage Member Popup -->

<div id="manageModal"
style="
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
justify-content:center;
align-items:center;
z-index:999;
">

<div
style="
width:450px;
background:#1b1b1b;
border:2px solid gold;
border-radius:15px;
padding:25px;
">

<h2 style="color:gold;margin-bottom:20px;">
Manage Member
</h2>

<p id="memberEmail"></p>

<label>Balance</label>

<input
id="newBalance"
type="number"
style="
width:100%;
padding:12px;
margin:10px 0 20px;
">

<label>Total Earned</label>

<input
id="newEarned"
type="number"
style="
width:100%;
padding:12px;
margin:10px 0 20px;
">

<button id="saveMember">

Save Changes

</button>

<button
id="closeModal"
style="background:red;color:white;">

Close

</button>

</div>

</div>
document.getElementById("closeModal").onclick = function(){

  document.getElementById("manageModal").style.display = "none";

};
  <script type="module" src="js/members.js"></script>

</body>
</html>
