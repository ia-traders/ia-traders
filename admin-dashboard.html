<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IA Traders Admin Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:white;
display:flex;
min-height:100vh;
}

/* ===========================
SIDEBAR
=========================== */

.sidebar{
width:260px;
background:#181818;
border-right:2px solid gold;
padding:20px;
}

.logo{
font-size:28px;
font-weight:bold;
color:gold;
text-align:center;
margin-bottom:40px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
text-decoration:none;
color:white;
padding:15px;
margin-bottom:10px;
border-radius:10px;
transition:.3s;
}

.menu a:hover{
background:gold;
color:black;
}

.menu a i{
font-size:20px;
width:25px;
text-align:center;
}

/* ===========================
MAIN AREA
=========================== */

.main{
flex:1;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.header h1{
color:gold;
}

.admin-info{
background:#1b1b1b;
padding:12px 18px;
border-radius:10px;
border:1px solid gold;
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<div class="logo">
IA Traders
</div>

<div class="menu">

<a href="deposit-requests.html">
<i class="fas fa-money-bill-wave"></i>
Deposit Requests
</a>

<a href="members.html">
<i class="fas fa-users"></i>
Members
</a>

<a href="#">
<i class="fas fa-money-bill-wave"></i>
Deposit Requests
</a>

<a href="#">
<i class="fas fa-wallet"></i>
Withdraw Requests
</a>

<a href="#">
<i class="fas fa-chart-line"></i>
Transactions
</a>

<a href="#">
<i class="fas fa-gear"></i>
Settings
</a>

<a href="#">
<i class="fas fa-right-from-bracket"></i>
Logout
</a>

</div>

</div>

<!-- Main -->

<div class="main">

<div class="header">

<h1>Admin Dashboard</h1>

<div class="admin-info">

Administrator

</div>

</div><!-- ===========================
DASHBOARD CARDS
=========================== -->

<div class="cards">

<div class="card">
    <i class="fas fa-users"></i>
    <h2 id="totalMembers">0</h2>
    <p>Total Members</p>
</div>

<div class="card">
    <i class="fas fa-money-bill-wave"></i>
    <h2 id="pendingDeposits">0</h2>
    <p>Pending Deposits</p>
</div>

<div class="card">
    <i class="fas fa-wallet"></i>
    <h2 id="pendingWithdraws">0</h2>
    <p>Pending Withdrawals</p>
</div>

<div class="card">
    <i class="fas fa-chart-line"></i>
    <h2 id="activePlans">0</h2>
    <p>Active Plans</p>
</div>

</div>

<!-- ===========================
CONTENT AREA
=========================== -->

<div class="content-box">

<h2 style="color:gold;margin-bottom:20px;">
Recent Activity
</h2>

<div id="recentActivity">

<p style="color:#999;">
Loading data...
</p>

</div>

</div>

<style>

/* ===========================
CARDS
=========================== */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:35px;
}

.card{

background:#1b1b1b;
border:2px solid gold;
border-radius:15px;
padding:25px;
text-align:center;
transition:.3s;

}

.card:hover{

transform:translateY(-5px);

}

.card i{

font-size:40px;
color:gold;
margin-bottom:15px;

}

.card h2{

font-size:32px;
margin-bottom:8px;
color:#2ecc71;

}

.card p{

color:#ccc;

}

/* ===========================
CONTENT BOX
=========================== */

.content-box{

background:#1b1b1b;
border:2px solid gold;
border-radius:15px;
padding:25px;

}

</style><!-- ===========================
QUICK ACTIONS
=========================== -->

<div class="content-box" style="margin-top:25px;">

<h2 style="color:gold;margin-bottom:20px;">
Quick Actions
</h2>

<div class="quick-actions">

<button id="membersBtn">
👥 Members
</button>

<button id="depositBtn">
💰 Deposits
</button>

<button id="withdrawBtn">
💸 Withdraws
</button>

<button id="transactionBtn">
📊 Transactions
</button>

<button id="settingsBtn">
⚙ Settings
</button>

</div>

</div>

<style>

/* ===========================
QUICK ACTIONS
=========================== */

.quick-actions{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;

}

.quick-actions button{

padding:18px;
font-size:16px;
font-weight:bold;

background:gold;
color:#000;

border:none;
border-radius:12px;

cursor:pointer;

transition:.3s;

}

.quick-actions button:hover{

background:#2ecc71;
transform:scale(1.05);

}

/* ===========================
RESPONSIVE
=========================== */

@media(max-width:900px){

body{

flex-direction:column;

}

.sidebar{

width:100%;
border-right:none;
border-bottom:2px solid gold;

}

.menu{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;

}

.main{

padding:20px;

}

}

@media(max-width:600px){

.cards{

grid-template-columns:1fr;

}

.quick-actions{

grid-template-columns:1fr;

}

.header{

flex-direction:column;
gap:15px;

}

}

</style>

</div>

<script type="module" src="js/admin.js"></script>

</body>
</html>
