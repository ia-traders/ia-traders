<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Investment Request - IA Traders</title>

<style>

body{
    background:#0f0f0f;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.box{
    max-width:400px;
    margin:auto;
    background:#1b1b1b;
    border:2px solid gold;
    border-radius:15px;
    padding:25px;
}

h1,h2{
    color:gold;
    text-align:center;
}

.payment{
    background:#111;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

input,select{
    width:90%;
    padding:12px;
    margin:10px;
    border-radius:8px;
    border:none;
}

button{
    width:95%;
    padding:12px;
    background:gold;
    border:none;
    border-radius:8px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h1>IA Traders</h1>

<div class="payment">

<h2>Payment Send To</h2>

<p>Method: FirstPay</p>

<p>Account Name: Muhammnd Zubair</p>

<p>Account Number: 03290293365</p>

</div>


<h2>Select Your Plan</h2>

<select id="plan" onchange="updateAmount()">

<option value="1000">Rs.1000 Plan</option>
<option value="1500">Rs.1500 Plan</option>
<option value="2000">Rs.2000 Plan</option>
<option value="3000">Rs.3000 Plan</option>
<option value="5000">Rs.5000 Plan</option>

</select>


<p id="amount">
Amount Send: Rs.1000
</p>

<input type="text" id="senderName" placeholder="Your Account Name">

<input type="text" id="senderNumber" placeholder="Your Payment Account Number">

<button id="submitRequest">
Submit Request
</button>

</div>


<script>

function updateAmount(){

let amount = document.getElementById("plan").value;

document.getElementById("amount").innerHTML =
"Amount Send: Rs." + amount;

}

</script>


</body>

</html>
