<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IA Traders Admin Panel</title>

<style>

body{
    background:#0f0f0f;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
    margin:0;
}

.box{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    color:gold;
    margin-bottom:30px;
}

.request{
    background:#1b1b1b;
    border:2px solid gold;
    border-radius:12px;
    padding:20px;
    margin:15px 0;
}

button{
    padding:10px 20px;
    background:gold;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
    margin-right:10px;
}

.reject{
    background:#e74c3c;
    color:white;
}

.approve{
    background:#2ecc71;
    color:white;
}

</style>

</head>

<body>

<div class="box">

<h1>IA Traders Admin Panel</h1>

<div id="requests">

Loading Requests...

</div>

</div>

<script type="module" src="js/admin.js"></script>

</body>

</html>
