<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Traders</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:#fff;
}

header{
background:#111;
padding:20px;
text-align:center;
border-bottom:2px solid gold;
}

header h1{
color:gold;
font-size:40px;
}

header p{
color:#ccc;
margin-top:8px;
}

.container{
max-width:1400px;
margin:auto;
padding:30px 20px;
}

.gallery{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card{
background:#1b1b1b;
border:2px solid gold;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 15px rgba(255,215,0,.25);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:260px;
object-fit:cover;
display:block;
}

.btn{
display:block;
margin:15px;
padding:14px;
text-align:center;
background:#25D366;
color:white;
font-weight:bold;
text-decoration:none;
border-radius:8px;
transition:.3s;
}

.btn:hover{
background:#1da851;
}

footer{
margin-top:40px;
text-align:center;
padding:20px;
color:#aaa;
border-top:1px solid #333;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
width:65px;
height:65px;
background:#25D366;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
text-decoration:none;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

@media(max-width:900px){
.gallery{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:500px){
.gallery{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<h1>IA Traders</h1>
<p>Professional Trading Community</p>
</header>
